name: smoke-test

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      expected_version:
        description: Wait until the live app reports this version (e.g. v0.10.6) before testing
        required: false
        default: ""
  workflow_call:
    inputs:
      expected_version:
        description: Wait until the live app reports this version (e.g. v0.10.6) before testing
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # covers the version wait (20 minutes by default) plus the checks themselves
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/example_statement.pdf
            .github/scripts/smoke_test.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Chromium
        run: uv run --no-project --with playwright playwright install --with-deps chromium

      - name: Check the live app
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: uv run --no-project --with playwright python .github/scripts/smoke_test.py --expected-version "$EXPECTED_VERSION"
