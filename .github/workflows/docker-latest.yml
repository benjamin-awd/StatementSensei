name: docker-latest

# Rebuilds latest when the image's inputs change on main; release tags come from publish.yml.
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - pyproject.toml
      - requirements.txt
      - README.md
      - entrypoint.py
      - tesseract.cfg
      - .streamlit/**
      - webapp/**
      - .github/workflows/docker-latest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/statementsensei:latest
