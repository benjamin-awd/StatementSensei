name: docker-latest

# The Dockerfile resolves dependencies at build time, so `latest` goes stale
# until the next release. This rebuilds it whenever something the image is
# built from changes on main, e.g. a merged monopoly-core bump. Release tags
# are pushed by publish.yml and left untouched.
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - pyproject.toml
      - README.md
      - entrypoint.py
      - webapp/**
      - .github/workflows/docker-latest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/statementsensei:latest
