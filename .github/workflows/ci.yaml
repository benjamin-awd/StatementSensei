name: ci

on:
  pull_request:
  push:
    branches: main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # refresh the package index first; the runner image's copy can point at
      # versions the mirror no longer serves
      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpoppler-cpp-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install StatementSensei dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run CI
        run: |
          uv run pytest .
