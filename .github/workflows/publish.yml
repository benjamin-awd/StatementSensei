name: publish

# Builds and pushes the Docker image. release-please.yaml calls this workflow
# when a release is created; workflow_dispatch builds an image by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and use as the Docker tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to use
        required: true
      branch:
        description: Branch to use (optional)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A release checks out its tag; a manual run checks out the chosen
          # branch, or the branch it was dispatched from.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/statementsensei:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/statementsensei:${{ inputs.tag }}
