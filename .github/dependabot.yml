version: 2
updates:
  # Opens a PR for each new monopoly-core release on PyPI. Bumps pyproject.toml
  # and uv.lock only; requirements.txt and dist/ are regenerated by the
  # release-artifacts job in release-please.yaml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "monopoly-core"
    commit-message:
      prefix: "build"
      include: "scope"
